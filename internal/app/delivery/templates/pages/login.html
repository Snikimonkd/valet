{{define "content"}}
{{with .Page}}
{{template "rubashka"}}
<main class="page">
  <div class="title-page">
    {{template "logo"}}
    <h1 class="wordmark">valet</h1>
    <p class="tagline">Все скидочные карты в одной колоде</p>
  </div>
  <form class="login-form" method="post" action="/login">
    <div class="field">
      <label class="field-label" for="f-login">Логин</label>
      <input class="field-input" id="f-login" name="login" value="{{.Login}}" autocomplete="username"
        autocapitalize="none" spellcheck="false" required
        {{- if .Error}} aria-invalid="true" aria-describedby="f-login-err"{{end}}>
    </div>
    <div class="field">
      <label class="field-label" for="f-password">Пароль</label>
      <input class="field-input" id="f-password" name="password" type="password" autocomplete="current-password" required
        {{- if .Error}} aria-invalid="true" aria-describedby="f-login-err"{{end}}>
    </div>
    {{with .Error}}<p class="notice notice-error" id="f-login-err" role="alert"><svg class="icon" aria-hidden="true"><use href="#i-alert"/></svg>{{.}}</p>{{end}}
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">Войти</button>
    </div>
  </form>
</main>
{{end}}
{{end}}
