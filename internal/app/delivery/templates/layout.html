{{define "layout"}}<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  {{- if eq .Name "card"}}
  {{/* экран кассы светлый в любой теме, полоса браузера над ним того же цвета */}}
  <meta name="theme-color" content="#F3EDDF">
  {{- else}}
  <meta name="theme-color" content="#F3EDDF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141C2E" media="(prefers-color-scheme: dark)">
  {{- end}}
  <title>{{.Title}} — valet</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="{{asset "logo.svg"}}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{asset "icon-192.png"}}">
  <link rel="stylesheet" href="{{asset "fonts.css"}}">
  <link rel="stylesheet" href="{{asset "app.css"}}">
  <script src="{{asset "htmx.min.js"}}" defer></script>
  <script src="{{asset "app.js"}}" defer></script>
</head>
<body data-page="{{.Name}}">
  {{template "sprite"}}
  <div class="screen" id="main">
    {{template "content" .}}
  </div>
</body>
</html>
{{end}}
