name: migrate

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    concurrency: production
    env:
      SSH_TARGET: ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}
      GOOSE_VERSION: v3.29.0
      # sha256 файла goose_linux_x86_64 из релиза GOOSE_VERSION, меняется вместе с версией
      GOOSE_SHA256: cc56e2f75532a4dd52f5ef2d31db0121e91079a9c2617bc0ad4e04e2d41c228b
    steps:
      - uses: actions/checkout@v7

      # готовый бинарник из релиза goose: секунды вместо установки Go и сборки.
      # Хеш сверяется с зашитым выше, подменённый файл не запустится
      - name: install goose
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/goose" \
            "https://github.com/pressly/goose/releases/download/$GOOSE_VERSION/goose_linux_x86_64"
          echo "$GOOSE_SHA256  $RUNNER_TEMP/goose" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/goose"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: set up ssh
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      # postgres на сервере слушает только localhost: миграции идут через ssh-туннель
      - name: open tunnel to postgres
        run: ssh -f -N -o ExitOnForwardFailure=yes -L 5432:localhost:5432 "$SSH_TARGET"

      - name: run migrations
        env:
          PG_DSN: ${{ secrets.PG_DSN }}
        run: goose -dir migrations postgres "$PG_DSN" up
