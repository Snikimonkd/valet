name: pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  lint:
    uses: ./.github/workflows/golangci-lint.yml

  build:
    needs: [ tests, lint ]
    uses: ./.github/workflows/build.yml
    secrets: inherit

  migrate:
    needs: build
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/migrate.yml
    secrets: inherit

  deploy:
    needs: migrate
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      tag: sha-${{ github.sha }}
